name: SEO Automation & Robustness Audit

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 1,4' # Runs automatically at midnight every Monday and Thursday
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  audit-and-index:
    name: Automated Indexing Ping
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run SEO Compliance Audit
        run: npm run seo-audit

      - name: Defer Indexing (Allow Vercel Deployment to Finish)
        run: sleep 120

      - name: Create Google Service Account File
        if: env.GOOGLE_SERVICE_ACCOUNT_JSON != ''
        run: echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" > google-service-account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Push Google Indexing API Payload
        if: env.GOOGLE_SERVICE_ACCOUNT_JSON != ''
        run: node scripts/ping-google.js
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Push IndexNow Payload (Bing / Yahoo / Yandex)
        run: node scripts/ping-sitemap.js

      - name: Retry IndexNow Payload (if first attempt failed)
        if: failure()
        run: |
          echo "[RETRY] First IndexNow ping failed. Retrying after 30 seconds..."
          sleep 30
          node scripts/ping-sitemap.js
