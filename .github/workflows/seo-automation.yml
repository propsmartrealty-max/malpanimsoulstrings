name: SEO Automation & Robustness Audit

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 1,4' # Runs automatically at midnight every Monday and Thursday
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  audit-and-index:
    name: Automated Indexing Ping
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Push IndexNow Payload
        # Runs the ping script independently of Vercel deployments to prevent timeouts.
        # Adds a 120 second delay to ensure Vercel finishes deploying the main branch before pinging.
        run: |
          sleep 120
          node scripts/ping-sitemap.js

      - name: Retry IndexNow Payload (if first attempt failed)
        if: failure()
        run: |
          echo "[RETRY] First IndexNow ping failed. Retrying after 30 seconds..."
          sleep 30
          node scripts/ping-sitemap.js
