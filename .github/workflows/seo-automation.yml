name: SEO Automation & Robustness Audit

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 1,4' # Runs automatically at midnight every Monday and Thursday
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  audit-and-index:
    name: Automated Indexing Ping
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Next.js Application
        run: npm run build

      - name: Run SEO Compliance Audit
        run: npm run seo-audit

      - name: Verify Live Deployment Version
        run: |
          COMMIT_SHA="${{ github.sha }}"
          URL="https://www.malpanimsoulstrings.com/version.txt"
          echo "Target commit SHA: $COMMIT_SHA"
          MAX_ATTEMPTS=40
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            echo "Checking deployment status (Attempt $((ATTEMPT+1))/$MAX_ATTEMPTS)..."
            LIVE_SHA=$(curl -sS -f --max-time 10 "$URL" || echo "")
            LIVE_SHA=$(echo "$LIVE_SHA" | tr -d '[:space:]')
            if [ "$LIVE_SHA" = "$COMMIT_SHA" ]; then
              echo "Deployment matches target commit SHA. Proceeding with indexing."
              exit 0
            fi
            echo "Current live SHA: '$LIVE_SHA'. Waiting 15 seconds..."
            ATTEMPT=$((ATTEMPT+1))
            sleep 15
          done
          echo "Warning: Timeout waiting for Vercel deployment matching $COMMIT_SHA. Proceeding with indexing anyway."

      - name: Create Google Service Account File
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json
          else
            echo "[INFO] GOOGLE_SERVICE_ACCOUNT_JSON secret is empty. Skipping file creation."
          fi

      - name: Push Google Indexing API Payload
        run: |
          if [ -f google-service-account.json ]; then
            node scripts/ping-google.js
          else
            echo "[INFO] google-service-account.json not found. Skipping Google Indexing API."
          fi

      - name: Push IndexNow Payload
        run: node scripts/ping-sitemap.js

