name: Google Indexing API Submit

on:
  # Trigger automatically when new code is pushed to the main branch
  push:
    branches:
      - main
  # Trigger automatically once a day at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  index-urls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # Since googleapis is in package.json from our earlier commit, we can just run npm install
        run: npm install

      - name: Execute Google Indexing API Script
        env:
          # Injects the GitHub Secrets securely into the Node.js environment
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: node scripts/index-urls.js
